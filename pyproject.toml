[project]
name = "freelance-timesheet-to-invoice-cli"
version = "1.0.0"
description = "Turn a freelance-time-cli timesheet.json into an invoice.json ready for freelance-invoice-cli. Zero dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "kleogeos", email = "kleogeos@gmail.com"}]
keywords = ["freelance", "invoice", "timesheet", "time-tracking", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://github.com/kleogeos/freelance-timesheet-to-invoice-cli"
Repository = "https://github.com/kleogeos/freelance-timesheet-to-invoice-cli"

[project.scripts]
freelance-timesheet2invoice = "timesheet2invoice:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["timesheet2invoice"]
